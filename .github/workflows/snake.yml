name: Generate Snake Animation

on:
  # Run automatically at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

  # Run on push to main branch
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate snake SVGs from abdulhafeef's contribution graph
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: abdulhafeef
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # Deploy generated SVGs to the 'output' branch
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
