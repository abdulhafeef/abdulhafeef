<svg width="540" height="230" viewBox="0 0 540 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<!--
  Project Card: Git Fundamentals
  Adapted from MIT-licensed Profile Signal Kit (c) 2026 Profile Signal Kit contributors
  Customized for Abdul Hafeef's Portfolio
-->
<title id="title">Git Fundamentals - Version Control Lab</title>
<desc id="desc">Hands-on version control lab exploring branching, commit workflows, and Linux environments</desc>

<defs>
  <radialGradient id="bg" cx="50%" cy="25%" r="85%">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="55%" stop-color="#070d1e"/>
    <stop offset="100%" stop-color="#030712"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
    <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" stroke="#a78bfa" stroke-opacity="0.04" stroke-width="1" fill="none"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .dash { stroke-dasharray: 12 16; animation: dash 14s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
    @keyframes dash { to { stroke-dashoffset: -560; } }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
</defs>

<!-- Card Body -->
<rect width="540" height="230" rx="20" fill="url(#bg)"/>
<rect width="540" height="230" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="538" height="228" rx="19" stroke="#a78bfa" stroke-opacity=".25"/>

<!-- Category & Top Status -->
<text x="28" y="38" class="mono" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="2.5">DEV WORKFLOW &amp; VCS</text>
<g class="pulse" transform="translate(476, 22)">
  <rect width="36" height="24" rx="6" fill="#0b172a" stroke="#a78bfa" stroke-opacity=".4"/>
  <text x="18" y="16" text-anchor="middle" class="mono" fill="#a78bfa" font-size="11" font-weight="700">LAB</text>
</g>

<!-- Title -->
<text x="28" y="80" class="sans" fill="#f8fafc" font-size="24" font-weight="800">Git Fundamentals</text>

<!-- Tech Stack -->
<text x="28" y="106" class="mono" fill="#00f0ff" font-size="12" font-weight="600">Git · GitHub · Linux Terminal</text>

<!-- Description -->
<text x="28" y="140" class="sans" fill="#cbd5e1" font-size="13.5">Structured repository focusing on professional version control practices,</text>
<text x="28" y="162" class="sans" fill="#94a3b8" font-size="13">branch management strategies, and Linux developer toolchains.</text>

<!-- Animated Tech Circuit -->
<path class="dash" filter="url(#glow)" d="M28 198 H200 C230 198 240 184 270 184 H488" stroke="url(#beam)" stroke-width="2.2" stroke-linecap="round"/>
<circle class="pulse" cx="490" cy="184" r="4.5" fill="#a78bfa"/>
<circle cx="28" cy="198" r="3" fill="#00f0ff"/>
</svg>
